name: MVP checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wonder
          POSTGRES_PASSWORD: wonder
          POSTGRES_DB: wonder
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wonder -d wonder"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://wonder:wonder@localhost:5432/wonder
      MOCK_MODE: "true"
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run ruff check backend evals
      - run: uv run ruff format --check backend evals
      - name: Prepare pytest cache parent
        run: mkdir -p .cache
      - run: uv run pytest
      - run: uv run pytest backend/tests/test_postgres.py --override-ini addopts=
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://wonder:wonder@localhost:5432/wonder
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run format:check && npm run lint && npm run typecheck && npm test && npm run build
