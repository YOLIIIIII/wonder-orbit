services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wonder
      POSTGRES_PASSWORD: wonder
      POSTGRES_DB: wonder
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - wonder_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wonder -d wonder"]
      interval: 5s
      timeout: 5s
      retries: 12
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://wonder:wonder@db:5432/wonder
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build:
      context: frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend

volumes:
  wonder_data:
